<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Collective Pixel</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f5f5f5;
    }

    canvas {
      border: 2px solid #333;
      margin-top: 20px;
    }

    #colorPicker {
      margin-top: 20px;
      width: 100px;
      height: 40px;
      border: none;
      cursor: pointer;
    }

    #info {
      margin-top: 10px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Collective Pixel</h1>

  <div>
  <label for="colorPicker">Farbe wählen:</label><br>
  <input type="color" id="colorPicker" value="#ff0000" />
  </div>
  

  <canvas id="canvas" width="400" height="400"></canvas>
  <p id="errorMsg" style="color: red; min-height: 1em;"></p>

  <p id="info">Klicke auf die Felder, um sie zu färben!</p>
  <button id="resetBtn" style="margin-bottom: 20px;">Neustart</button>

  <script src="script.js"></script>
</body>
</html>
